<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malaysia AIP Flash Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column, a deck picker above a single flight-strip style card, answer buttons below */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --ink: #16202b;
  --muted: #5b6876;
  --line: #c9d1da;
  --accent: #1f5f8b;
  --strip: #f2c94c;
  --good: #2e7d4f;
  --again: #b4472f;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --surface: #18212b; --ink: #e6ebf0; --muted: #94a2b1; --line: #2c3946;
  --accent: #6fb0de; --strip: #d9b23f; --good: #5fbf86; --again: #e27b62; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #18212b; --ink: #e6ebf0; --muted: #94a2b1; --line: #2c3946;
  --accent: #6fb0de; --strip: #d9b23f; --good: #5fbf86; --again: #e27b62; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; letter-spacing: .01em; margin: 0; line-height: 1.1; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
.stats { font-family: var(--mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.decks { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-family: var(--display); font-weight: 600; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 14px; border-radius: 4px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip:focus-visible, button:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  min-height: 300px; display: grid; grid-template-columns: 14px 1fr; cursor: pointer; overflow: hidden;
  box-shadow: 0 1px 0 var(--line); }
.card .bar { background: var(--strip); }
.card .content { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.ref { color: var(--accent); }
.side { font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .85rem; color: var(--muted); }
.q { font-family: var(--display); font-weight: 600; font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.a { font-size: 1.1rem; margin: 0; white-space: pre-line; }
.a code, .q code { font-family: var(--mono); font-size: .92em; }
.hint { margin-top: auto; color: var(--muted); font-size: .85rem; }
.verify { font-size: .8rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: .05em; text-transform: uppercase;
  padding: 12px; border-radius: 6px; border: 2px solid; background: var(--surface); cursor: pointer; }
.btn.again { color: var(--again); border-color: var(--again); }
.btn.good { color: var(--good); border-color: var(--good); }
.btn:disabled { opacity: .4; cursor: default; }
.tools { display: flex; gap: 16px; flex-wrap: wrap; font-size: .9rem; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.done { text-align: center; padding: 40px 20px; }
.done h2 { font-family: var(--display); font-size: 1.6rem; margin: 0 0 6px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.mode { font-family: var(--display); font-weight: 700; font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase;
  padding: 10px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.mode[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mode:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.qbar { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); cursor: pointer; white-space: pre-line; }
.opt code { font-family: var(--mono); }
.opt:disabled { cursor: default; }
.opt.right { border: 2px solid var(--good); color: var(--good); font-weight: 600; }
.opt.wrong { border: 2px solid var(--again); color: var(--again); text-decoration: line-through; }
.score { font-family: var(--display); font-weight: 700; font-size: 3.2rem; line-height: 1; margin: 6px 0; font-variant-numeric: tabular-nums; }
.btn.go { color: var(--accent); border-color: var(--accent); width: 100%; }
.flagbox { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.flag-link { color: var(--muted); font-size: .85rem; align-self: flex-start; }
.flag-form label { font-weight: 600; }
.flag-form textarea, .flag-form input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); width: 100%; }
.flag-actions { display: flex; align-items: center; gap: 16px; margin-top: 4px; }
.flag-actions .btn.go { width: auto; padding: 8px 16px; font-size: 1rem; }
.flag-ok { color: var(--good); margin: 0; }
.flag-err { color: var(--again); margin: 0; }
.ver { white-space: nowrap; }
.terms { display: block; margin-top: 6px; }
.terms b { color: var(--ink); font-weight: 600; }
footer { color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .12s ease; } .card:active { transform: scale(.99); } }
</style>
<style>[hidden]{display:none!important} *,*::before,*::after{box-sizing:border-box} body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Malaysia AIP Flash Cards</h1>
      <p class="sub">Study aid for air traffic controllers</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="modes" role="group" aria-label="Choose a mode">
    <button class="mode" type="button" data-mode="study">Study</button>
    <button class="mode" type="button" data-mode="quiz">Quiz</button>
  </div>

  <div class="decks" id="decks" role="group" aria-label="Choose a deck"></div>

  <div id="quizArea" hidden></div>

  <div id="cardArea"></div>

  <div class="actions" id="actions">
    <button class="btn again" id="againBtn" type="button">Again</button>
    <button class="btn good" id="goodBtn" type="button">Got it</button>
  </div>

  <div class="tools">
    <button class="link" id="shuffleBtn" type="button">Shuffle deck</button>
    <button class="link" id="resetBtn" type="button">Reset my progress</button>
  </div>

  <footer>
    ENR cards are based on AIRAC AIP AMDT 04/26 (effective 29 OCT 2026). GEN and AD cards are unchecked samples. Always refer to the current Malaysian AIP at aip.caam.gov.my. Study aid only, not for operational use. <span class="ver">App version 10</span>
  </footer>
</div>

  // Kota Kinabalu RNP Z RWY 20 (AR): read from chart AD 2-WBKK-8-27 dated 01 DEC 2022, as published in the current eAIP.
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", g: "fix", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): which fixes are the IAFs?", a: "SABNU, KK688, DUMUB and KK660" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", g: "fix", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): which fixes are the IFs, and at what altitudes?", a: "KK658 at 2 100 ft and KK642 at 2 400 ft" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", g: "fix", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): which fix is the FAF, and at what altitude?", a: "KK630 at 1 000 ft, 3.1 NM from THR 20" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): what are the VPA and the RDH?", a: "VPA 2.8°, RDH 55 ft" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): what is the missed approach procedure?", a: "Climb to 4 000 ft via the RNP missed approach track to KK688, or as directed by ATC." },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", g: "ft", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): OCA (OCH) for Category C and D aircraft?", a: "705 ft (695 ft), RNP 0.3" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): are circling and alternate minima published?", a: "No. Circling and alternate are N/A." },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): at what aerodrome temperatures is the approach not authorised?", a: "Below 17°C or above 40°C" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): which three requirements are listed in the chart notes?", a: "Authorisation required, GNSS required and RF required." },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): which RNP value is required from the IAFs to the FAF?", a: "RNP 0.3" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): what speed restriction applies approaching KK642 and KK550?", a: "At or below 225 KIAS" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK) RNP Z RWY 20 (AR): do the PAPI and the vertical path angle coincide?", a: "No. The chart notes they are not coincident." },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", q: "Kota Kinabalu (WBKK): aerodrome elevation and THR RWY 20 elevation?", a: "Aerodrome 14 ft, THR RWY 20 11 ft" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", g: "freq", q: "Kota Kinabalu (WBKK): APP and TWR frequencies?", a: "APP 119.1 MHz, TWR 118.3 MHz" },
  { part: "AD", v: 1, ref: "AD 2-WBKK-8-27", g: "freq", q: "Kota Kinabalu (WBKK): GND and ATIS frequencies?", a: "GND 121.6 MHz, ATIS 127.4 MHz" },
];

// ----- APP -----
const AIRAC = "AIRAC AIP AMDT 04/26, effective 29 OCT 2026";
// ----- FLAGGING -----
// Flags go to a Google Form; responses are reviewed in the form's linked spreadsheet.
// Until FLAG_URL is set, the Flag button stays hidden.
const FLAG_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdAlhIAKlvR-XlSOA0PjdIxiWqRdoz0LdfMnpm8pB_-KczgTg/formResponse";
const FLAG_FIELDS = { card: "entry.1749472259", answer: "entry.962471277", what: "entry.648032319", fix: "entry.1583769371", who: "entry.930183847", airac: "entry.81139024" };
let flag = { open: false, sent: new Set(), busy: false, error: "", draft: { what: "", fix: "", who: "" } };
const esc = t => String(t).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const plain = html => html.replace(/<[^>]+>/g, "");
function flagBlock(c) {
  if (!FLAG_URL) return "";
  if (flag.sent.has(id(c))) return `<div class="flagbox"><p class="flag-ok">Thanks. Your flag has been sent for review.</p></div>`;
  if (!flag.open) return `<div class="flagbox"><button class="link flag-link" type="button" data-flag="open">Flag this answer as wrong</button></div>`;
  return `<div class="flagbox flag-form">
    <label for="flagWhat">What is wrong with this card?</label>
    <textarea id="flagWhat" rows="3" placeholder="e.g. The transition level changed in the latest AIRAC">${esc(flag.draft.what)}</textarea>
    <label for="flagFix">Correct answer, if you know it</label>
    <input id="flagFix" type="text" placeholder="Optional" value="${esc(flag.draft.fix)}">
    <label for="flagWho">Your name or unit</label>
    <input id="flagWho" type="text" placeholder="Optional" value="${esc(flag.draft.who)}">
    ${flag.error ? `<p class="flag-err">${esc(flag.error)}</p>` : ""}
    <div class="flag-actions">
      <button class="btn go" type="button" data-flag="send" ${flag.busy ? "disabled" : ""}>${flag.busy ? "Sending…" : "Send flag"}</button>
      <button class="link" type="button" data-flag="cancel">Cancel</button>
    </div></div>`;
}
function rerender() { mode === "quiz" ? renderQuiz() : render(); }
async function handleFlag(action) {
  const c = mode === "quiz" ? quiz.cards[quiz.i] : current;
  if (!c) return;
  if (action === "open") { flag.open = true; flag.error = ""; rerender(); document.getElementById("flagWhat").focus(); return; }
  if (action === "cancel") { flag.open = false; rerender(); return; }
  const what = document.getElementById("flagWhat").value.trim();
  const fix = document.getElementById("flagFix").value.trim();
  const who = document.getElementById("flagWho").value.trim();
  flag.draft = { what, fix, who };
  if (!what) { flag.error = "Please describe what is wrong before sending."; rerender(); return; }
  flag.busy = true; flag.error = ""; rerender();
  try {
    await sendFlag({ card: `${c.part} | ${c.ref} | ${c.q}`, answer: plain(c.a), what, fix, who, airac: c.v ? AIRAC : "unchecked sample" });
    flag.sent.add(id(c)); flag.open = false; flag.draft = { what: "", fix: "", who };
  } catch (err) {
    flag.error = "The flag could not be sent. Check your connection and try again.";
  }
  flag.busy = false; rerender();
}
async function sendFlag(data) {
  const body = new URLSearchParams();
  for (const k in FLAG_FIELDS) body.append(FLAG_FIELDS[k], data[k] || "");
  body.append("fvv", "1");
  body.append("pageHistory", "0");
  // Google Forms does not allow reading the reply, so a request that goes through counts as sent.
  await fetch(FLAG_URL, { method: "POST", mode: "no-cors", body });
}

const sourceNote = c => c.v
  ? `Source: AIP Malaysia ${c.ref} (${AIRAC}).${termsNote(c)}`
  : `Sample card, not yet checked. See AIP Malaysia ${c.ref}.${termsNote(c)}`;
// Abbreviations explained under each answer.
const TERMS = {
  // Only the less familiar ones; everyday terms (ATC, QNH, TMA, FIR, IAF, FAF...) are left out on purpose.
  "ADS-B": "Automatic Dependent Surveillance – Broadcast", "ADS-C": "Automatic Dependent Surveillance – Contract",
  AR: "Authorisation Required", ATZ: "Aerodrome Traffic Zone", CPDLC: "Controller–Pilot Data Link Communications", EAT: "Expected Approach Time",
  GNSS: "Global Navigation Satellite System", IF: "Intermediate Fix", OCA: "Obstacle Clearance Altitude", OCH: "Obstacle Clearance Height",
  PBN: "Performance-Based Navigation", RDH: "Reference Datum Height", RF: "Radius to Fix (a curved path)", RNP: "Required Navigation Performance",
  TA: "Terminal Area", TCA: "Terminal Control Area", THR: "Threshold (start of the usable landing part of the runway)", VPA: "Vertical Path Angle"
};
const TERM_RE = new RegExp("(?<![A-Za-z-])(" + Object.keys(TERMS).sort((a, b) => b.length - a.length).map(k => k.replace("-", "\\-")).join("|") + ")(?![A-Z-])", "g");
function termsNote(c) {
  const found = [...new Set((plain(c.q + " " + c.a)).match(TERM_RE) || [])];
  return found.length ? `<span class="terms">${found.map(k => `<b>${k}</b> ${TERMS[k]}`).join(" · ")}</span>` : "";
}
const DECKS = ["All", "GEN", "ENR", "AD"];
const store = {
  get() { try { return JSON.parse(localStorage.getItem("aipfc") || "{}"); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem("aipfc", JSON.stringify(v)); } catch (e) {} }
};
let saved = store.get();
let known = new Set(saved.known || []);
let deck = DECKS.includes(saved.deck) ? saved.deck : "All";
let mode = saved.mode === "quiz" ? "quiz" : "study";
let best = saved.best || {};
let queue = [], current = null, flipped = false;
let quiz = null;
const QUIZ_LEN = 10;

const id = c => c.part + "|" + c.q;
const save = () => store.set({ known: [...known], deck, mode, best });
const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ----- QUIZ -----
// Wrong options come from other cards of the same kind (g), then the same part.
function optionsFor(card) {
  const pool = [];
  const add = list => list.forEach(c => { if (c.a !== card.a && !pool.includes(c.a)) pool.push(c.a); });
  if (card.g) add(shuffled(CARDS.filter(c => c.g === card.g)));
  add(shuffled(CARDS.filter(c => c.part === card.part)));
  add(shuffled(CARDS));
  return shuffled([card.a, ...pool.slice(0, 3)]);
}
function startQuiz() {
  flag.open = false;
  const inDeck = shuffled(CARDS.filter(c => deck === "All" || c.part === deck)).slice(0, QUIZ_LEN);
  quiz = { cards: inDeck, i: 0, score: 0, picked: null, opts: optionsFor(inDeck[0]) };
  renderQuiz();
}
function pick(n) {
  if (!quiz || quiz.picked !== null || quiz.i >= quiz.cards.length) return;
  quiz.picked = n;
  if (quiz.opts[n] === quiz.cards[quiz.i].a) quiz.score++;
  renderQuiz();
}
function nextQuestion() {
  quiz.i++; quiz.picked = null; flag.open = false;
  if (quiz.i < quiz.cards.length) quiz.opts = optionsFor(quiz.cards[quiz.i]);
  else { const pct = Math.round(100 * quiz.score / quiz.cards.length); if (!(best[deck] >= pct)) best[deck] = pct; save(); }
  renderQuiz();
}
function renderQuiz() {
  const area = document.getElementById("quizArea");
  const total = quiz.cards.length;
  if (quiz.i >= total) {
    const pct = Math.round(100 * quiz.score / total);
    area.innerHTML = `<div class="card" style="cursor:default"><div class="bar"></div><div class="content done">
      <div class="side">Quiz complete · ${deck}</div>
      <div class="score">${quiz.score} / ${total}</div>
      <p>${pct}% correct. Your best on this deck: ${best[deck]}%.</p>
      <button class="btn go" id="againQuiz" type="button">New quiz</button></div></div>`;
    return;
  }
  const c = quiz.cards[quiz.i], done = quiz.picked !== null;
  area.innerHTML = `<div class="card" style="cursor:default"><div class="bar"></div><div class="content">
    <div class="qbar"><span>Question ${quiz.i + 1} of ${total}</span><span>Score ${quiz.score}</span></div>
    <div class="meta"><span>${c.part}</span><span class="ref">${c.ref}</span></div>
    <p class="q">${c.q}</p>
    <div class="opts">${quiz.opts.map((o, n) => {
      let cls = "opt";
      if (done && o === c.a) cls += " right";
      else if (done && n === quiz.picked) cls += " wrong";
      return `<button class="${cls}" type="button" data-opt="${n}" ${done ? "disabled" : ""}>${o}</button>`;
    }).join("")}</div>
    ${done ? `<div class="verify">${sourceNote(c)}</div>${flagBlock(c)}
      <button class="btn go" id="nextQ" type="button">${quiz.i + 1 < total ? "Next question" : "See score"}</button>` : ""}
  </div></div>`;
}

function showMode() {
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  const isQuiz = mode === "quiz";
  document.getElementById("quizArea").hidden = !isQuiz;
  document.getElementById("cardArea").hidden = isQuiz;
  document.getElementById("actions").hidden = isQuiz;
  document.getElementById("shuffleBtn").hidden = isQuiz;
  document.getElementById("resetBtn").hidden = isQuiz;
  if (isQuiz) { render(); startQuiz(); } else buildQueue(true);
}

function buildQueue(shuffle) {
  queue = CARDS.filter(c => (deck === "All" || c.part === deck) && !known.has(id(c)));
  if (shuffle) for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  next();
}
function next() { current = queue.shift() || null; flipped = false; flag.open = false; render(); }

function render() {
  const inDeck = CARDS.filter(c => deck === "All" || c.part === deck);
  const learned = inDeck.filter(c => known.has(id(c))).length;
  document.getElementById("stats").textContent = learned + " / " + inDeck.length + " learned";

  document.getElementById("decks").innerHTML = DECKS.map(d =>
    `<button class="chip" type="button" data-deck="${d}" aria-pressed="${d === deck}">${d}</button>`).join("");

  const area = document.getElementById("cardArea");
  const again = document.getElementById("againBtn"), good = document.getElementById("goodBtn");
  if (!current) {
    area.innerHTML = `<div class="card" style="cursor:default"><div class="bar"></div><div class="content done">
      <h2>Deck complete</h2><p>You have marked every card in this deck as learned. Pick another deck, or reset your progress to study them again.</p></div></div>`;
    again.disabled = good.disabled = true;
    return;
  }
  again.disabled = good.disabled = !flipped;
  area.innerHTML = `<div class="card" id="card" tabindex="0" role="button" aria-label="Flash card. Tap to flip.">
    <div class="bar"></div><div class="content">
      <div class="meta"><span>${current.part}</span><span class="ref">${current.ref}</span></div>
      <div class="side">${flipped ? "Answer" : "Question"}</div>
      <p class="q">${current.q}</p>
      ${flipped ? `<p class="a">${current.a}</p><div class="verify">${sourceNote(current)}</div>${flagBlock(current)}`
                : `<div class="hint">Tap the card or press Space to show the answer</div>`}
    </div></div>`;
}

function flip() { if (current) { flipped = !flipped; render(); } }
function answer(gotIt) {
  if (!current || !flipped) return;
  if (gotIt) known.add(id(current)); else queue.push(current);
  save(); next();
}

document.addEventListener("click", e => {
  const chip = e.target.closest("[data-deck]");
  if (chip) { deck = chip.dataset.deck; save(); if (mode === "quiz") { render(); startQuiz(); } else buildQueue(true); return; }
  const m = e.target.closest("[data-mode]");
  if (m) { mode = m.dataset.mode; save(); showMode(); return; }
  const opt = e.target.closest("[data-opt]");
  if (opt) { pick(+opt.dataset.opt); return; }
  if (e.target.closest("#nextQ")) { nextQuestion(); return; }
  if (e.target.closest("#againQuiz")) { startQuiz(); return; }
  if (e.target.closest(".flagbox")) {
    const f = e.target.closest("[data-flag]");
    if (f) handleFlag(f.dataset.flag);
    return;
  }
  if (e.target.closest("#card")) flip();
});
document.getElementById("againBtn").onclick = () => answer(false);
document.getElementById("goodBtn").onclick = () => answer(true);
document.getElementById("shuffleBtn").onclick = () => buildQueue(true);
document.getElementById("resetBtn").onclick = () => { known.clear(); save(); buildQueue(true); };
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button:not(#card), input, textarea")) return;
  if (mode === "quiz") {
    if (quiz && quiz.picked === null && /^[1-4]$/.test(e.key)) pick(+e.key - 1);
    else if (quiz && quiz.picked !== null && e.key === "Enter") nextQuestion();
    return;
  }
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (flipped && (e.key === "1" || e.key === "ArrowLeft")) answer(false);
  else if (flipped && (e.key === "2" || e.key === "ArrowRight")) answer(true);
});

showMode();
</script>
</body>
</html>
